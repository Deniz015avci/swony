<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deniz | Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ARKA PLAN VİDEOSU -->
    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="background.mp4.mp4" type="video/mp4">
    </video>

    <!-- VİDEONUN ÜSTÜNDEKİ KARARTMA -->
    <div class="overlay"></div>


    <!-- PROFİL KARTI -->
    <main class="profile-card">

        <!-- ONLINE -->
        <div class="status">
            <span class="dot"></span>
            <span>ONLINE</span>
        </div>


        <!-- PROFİL FOTOĞRAFI -->
        <img
            src="foto.jfif"
            alt="Profil Fotoğrafı"
            class="avatar"
        >


        <!-- İSİM -->
        <h1>Deniz</h1>

        <!-- KULLANICI ADI -->
        <p class="username">@swony_</p>

        <!-- MESLEK / KONUM -->
        <p class="role">
            WEB DEVELOPER · AUSTRIA
        </p>


        <!-- AÇIKLAMA -->
        <p class="bio">
            Web geliştirme öğreniyorum.<br>
            Kendi projelerimi geliştiriyorum.
        </p>


        <!-- LİNKLER -->
        <div class="links">

            <!-- DISCORD -->
            <a
                href="https://discord.gg/mWffA7axF"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Discord</span>
                <span>→</span>
            </a>


            <!-- GITHUB -->
            <a
                href="https://github.com/Deniz015avci"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>GitHub</span>
                <span>→</span>
            </a>


            <!-- INSTAGRAM -->
            <a
                href="#"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Instagram</span>
                <span>→</span>
            </a>


            <!-- STEAM -->
            <a
                href="#"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Steam</span>
                <span>→</span>
            </a>

        </div>


        <!-- FOOTER -->
        <footer>
            © 2026 Deniz
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
