<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deniz | Links</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- ARKA PLAN VİDEOSU -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="background.mp4.mp4" type="video/mp4">
    </video>

    <!-- KARARTMA -->
    <div class="overlay"></div>

    <!-- PROFİL KARTI -->
    <main class="profile-card">

        <!-- ONLINE -->
        <div class="status">
            <span class="dot"></span>
            ONLINE
        </div>

        <!-- PROFİL FOTOĞRAFI -->
        <div class="avatar-wrapper">
            <img
                src="foto.jfif"
                alt="Deniz profil fotoğrafı"
                class="avatar"
            >
        </div>

        <!-- İSİM -->
        <h1>Deniz</h1>

        <p class="username">@swony_</p>

        <p class="role">
            WEB DEVELOPER • AUSTRIA
        </p>

        <!-- BIO -->
        <p class="bio">
            Web geliştirme öğreniyorum.<br>
            Kendi projelerimi geliştiriyorum.
        </p>

        <!-- LİNKLER -->
        <div class="links">

            <!-- DISCORD PROFİLİ -->
            <a
                href="https://discord.com/users/974315779031990352"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="link-left">
                    <i class="fa-brands fa-discord"></i>
                    <span>Discord</span>
                </div>

                <span class="arrow">→</span>
            </a>

            <!-- GITHUB -->
            <a
                href="https://github.com/Deniz015avci"
                class="link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="link-left">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </div>

                <span class="arrow">→</span>
            </a>

            <!-- INSTAGRAM -->
            <a
                href="#"
                class="link"
            >
                <div class="link-left">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>

                <span class="arrow">→</span>
            </a>

            <!-- STEAM -->
            <a
                href="#"
                class="link"
            >
                <div class="link-left">
                    <i class="fa-brands fa-steam"></i>
                    <span>Steam</span>
                </div>

                <span class="arrow">→</span>
            </a>

        </div>

        <footer>
            © 2026 Deniz
        </footer>

    </main>

</body>

</html>
